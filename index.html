<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e7" />
    <meta
      name="description"
      content="七桥漫游：在纸雕水城中走遍每座桥，发现七桥问题，再亲手修桥创造新的归途。32 个主线关、工程委托与每日漫游。"
    />
    <title>七桥漫游 · Seven Bridges</title>
    <link rel="canonical" href="https://bridges.orangely.xyz/" />
    <meta property="og:title" content="七桥漫游 · Seven Bridges" />
    <meta property="og:description" content="每座桥，一次。读懂一座城，也为它造一条新路。" />
    <meta property="og:image" content="https://bridges.orangely.xyz/og.png" />
    <meta property="og:url" content="https://bridges.orangely.xyz/" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/index.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="masthead">
        <a class="brand" href="#SB01"
          ><svg class="brand-mark" viewBox="0 0 40 28" aria-hidden="true">
            <path d="M3 19h34M7 19q13 -15 26 0" />
            <path class="brand-piers" d="M13.5 19v-5.5M20 19v-7.5M26.5 19v-5.5" />
            <path class="brand-water" d="M4 25q4 -2.4 8 0t8 0t8 0t8 0" /></svg
          ><span id="brand-title">七桥漫游</span><span class="brand-en">SEVEN BRIDGES</span></a
        >
        <nav id="main-nav" aria-label="主导航">
          <button id="map-button"></button><button id="help-button"></button
          ><button id="settings-button" class="icon-button" aria-label="设置">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h9M18 7h2M4 17h3M12 17h8" />
              <circle cx="15.5" cy="7" r="2.3" />
              <circle cx="9.5" cy="17" r="2.3" />
            </svg>
          </button>
        </nav>
      </header>
      <main>
        <div class="intro">
          <div>
            <p class="eyebrow">A CITY, ONE JOURNEY</p>
            <h1 id="tagline">每座桥，一次。</h1>
            <p id="subtitle">读懂一座城，也为它造一条新路。</p>
          </div>
          <button class="daily-link" id="daily-button">
            <span
              ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="5" width="16" height="15" rx="2" />
                <path d="M4 10h16M9 3v4M15 3v4" />
                <circle cx="12" cy="15" r="1.4" fill="currentColor" /></svg></span
            ><span id="daily-label"></span><small id="daily-date"></small>
          </button>
        </div>
        <section class="journey-layout">
          <div class="map-panel">
            <div class="map-topline">
              <span id="chapter-label"></span><span id="mobile-level-title"></span
              ><span id="view-label">CITY ATLAS</span>
            </div>
            <div id="stage" class="stage"></div>
            <div class="map-bottomline">
              <span id="level-number"></span><span id="stage-note"></span
              ><span class="compass" aria-hidden="true">N ↑</span>
            </div>
            <div id="complete-banner" hidden></div>
          </div>
          <aside class="journal">
            <p id="mode-label" class="eyebrow"></p>
            <h2 id="level-title"></h2>
            <p id="objective" class="objective"></p>
            <div class="progress">
              <div>
                <strong id="progress-number">0 / 3</strong><span id="progress-label"></span>
              </div>
              <div id="progress-dots" class="progress-dots" aria-hidden="true"></div>
            </div>
            <div class="endpoints"><span id="start-fact"></span><span id="end-fact"></span></div>
            <section class="route-journal">
              <h3 id="route-title"></h3>
              <div id="route-history"></div>
            </section>
            <div id="engineering" hidden></div>
            <div id="discovery" hidden></div>
            <p id="message" class="message" role="status" aria-live="polite"></p>
            <div id="hint-detail"></div>
            <div id="journal-actions"></div>
          </aside>
          <div id="journey-controls" class="toolbar" role="group" aria-label="旅程操作">
            <button id="undo-button">
              <span
                ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 6L4 11l5 5" />
                  <path d="M4 11h10a5 5 0 0 1 0 10h-4" /></svg></span
              ><span></span></button
            ><button id="lens-button">
              <span
                ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="6" cy="7" r="2.5" />
                  <circle cx="18" cy="7" r="2.5" />
                  <circle cx="12" cy="18" r="2.5" />
                  <path d="M8.5 7h7M7.3 9.2l3.4 6.6M16.7 9.2l-3.4 6.6" /></svg></span
              ><span></span></button
            ><button id="hint-button">
              <span
                ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9.5 18h5M10.5 21h3" />
                  <path
                    d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"
                  /></svg></span
              ><span></span></button
            ><span class="toolbar-spacer"></span
            ><button id="restart-button">
              <span
                ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 12a8 8 0 1 1-2.34-5.66" />
                  <path d="M20 4v4h-4" /></svg></span
              ><span></span>
            </button>
          </div>
        </section>
        <div id="save-warning" class="save-warning" hidden role="alert">
          <span></span><button id="retry-save"></button>
        </div>
      </main>
      <footer>
        <a id="collection-link" href="https://games.orangely.xyz/"></a
        ><span>EST. 1736 <i>·</i> MADE FOR WANDERING</span><span id="saved-state"></span>
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="dialog-close" class="icon-button">×</button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <noscript>七桥漫游需要启用 JavaScript。Seven Bridges requires JavaScript.</noscript>
  </body>
</html>

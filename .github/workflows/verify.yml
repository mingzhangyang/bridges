name: Verify Seven Bridges
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose Prettier differences (temporary)
        run: |
          npx prettier tests/smoke-bridges.mjs > /tmp/formatted-browser-tests
          diff -u tests/smoke-bridges.mjs /tmp/formatted-browser-tests || true
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridges-browser-evidence
          path: test-results/
          if-no-files-found: ignore
